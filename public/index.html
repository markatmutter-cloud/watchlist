<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Stuck with the default viewport (no viewport-fit=cover). Tried
         cover briefly to get the green theme-color to extend behind the
         iOS status bar, but it broke the bottom tab bar layout — env()
         values weren't applied until a layout-trigger event (keyboard
         opening), so on first paint the tabs sat partly behind the home
         indicator. theme-color alone gives the green status-bar tint
         in PWA standalone mode without this side effect. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Watchlist: For people who watch vintage watches</title>
    <meta name="description" content="Search, save, and follow listings from across the vintage watch world." />
    <link rel="canonical" href="https://the-watch-list.app/" />

    <!-- Open Graph / Twitter card. og:image points at the existing
         apple-touch-icon (1024×1024) — placeholder until a proper
         1200×630 social preview is generated. Most platforms will
         centre-crop the square. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Watchlist" />
    <meta property="og:title" content="Watchlist: For people who watch vintage watches" />
    <meta property="og:description" content="Search, save, and follow listings from across the vintage watch world." />
    <meta property="og:url" content="https://the-watch-list.app/" />
    <meta property="og:image" content="https://the-watch-list.app/apple-touch-icon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Watchlist: For people who watch vintage watches" />
    <meta name="twitter:description" content="Search, save, and follow listings from across the vintage watch world." />
    <meta name="twitter:image" content="https://the-watch-list.app/apple-touch-icon.png" />

    <!-- iOS home-screen icon. The 180×180 size is what iOS actually
         reads on "Add to Home Screen" — when only an oversized
         (1024×1024) icon is offered, iOS may silently fall back to a
         screenshot of the page rather than render the oversized PNG.
         Keep the 1024 around for og:image / twitter:image (above) but
         point apple-touch-icon at the proper-sized variant. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon-180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <!-- Web manifest for Android Chrome / desktop PWA install. iOS
         doesn't read this for icons (apple-touch-icon links above are
         the load-bearing part on iOS), but it provides theme + name
         for the browser-level install prompt on other platforms. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-title" content="Watchlist" />
    <!-- PWA install capability. The standardised `mobile-web-app-capable`
         is what modern Chrome (Android + desktop) reads; iOS Safari
         still reads only the apple- prefixed version, so we ship both.
         Chrome consoles a deprecation warning if the apple- one
         appears alone — adding the standard form silences it without
         breaking iOS PWA install. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- iOS PWA status bar: "default" lets theme-color tint it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Theme color drives Safari's toolbar, the iOS PWA status bar and the
         Android Chrome address bar. Spell it out for both light and dark
         schemes so dark-mode phones don't fall back to system black.
         These are the FIRST-PAINT values only: <ChromeTint> (src/chromeTint.js)
         rewrites them to match whichever surface is at the top of the page.
         Paper, because Home and the Watches page — the two ways in — are
         light; the olive bar is the exception now, not the rule. -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#1c1c1e" />

    <!-- Schema.org JSON-LD. WebSite + minimal Organization so Google can
         render a sitelinks search box and pull a clean knowledge-graph
         entry. SearchAction is wired to the in-app search via a
         query-param target — there's no formal /search route, but the
         Listings tab consumes ?search= and renders matching items. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Watchlist",
      "alternateName": "The Watch List",
      "url": "https://the-watch-list.app/",
      "description": "For people who watch vintage watches. Search, save, and follow listings from across the vintage watch world.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://the-watch-list.app/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      /* Font-family at <body> level so portal-rendered nodes
         (Card ⋯ menu, mobile search overlay, future toasts) inherit
         it. Without this, anything portaled to document.body falls
         back to the browser default (Times-style serif on iOS) —
         Mark report 2026-05-22 on the mobile search overlay rows.
         Same pattern as the theme-vars-on-:root fix from PR #168. */
      body {
        -webkit-font-smoothing: antialiased;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      }

      /*
        Print scoping for in-app print-to-scale tools (currently:
        References → Watch size comparison). Each tool renders its
        printable sheet via React Portal as a direct child of <body>
        with class `size-compare-print-sheet-portal` (or whatever
        future tools use). When printing, hide every direct child of
        <body> EXCEPT that one — that hides the entire React app
        (#root) and surfaces only the print sheet.

        Why portal-scoped instead of `body * { visibility: hidden }`:
        the prototype's pattern was global and brittle. Scoping by
        portal class keeps print clean, leaves printing from any
        OTHER page on the site unaffected, and works regardless of
        where in the app's tree the tool is mounted.

        Add a new printable tool: render its sheet via createPortal
        to document.body with a class matching the selector below
        (or extend the selector to a list).
      */
      @media print {
        body { background: #fff; }
        body > *:not(.size-compare-print-sheet-portal) { display: none !important; }
        .size-compare-print-sheet-portal { display: block !important; }
        @page { size: letter portrait; margin: 0.5in; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
