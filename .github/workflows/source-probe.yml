name: CI source probe

# Manual diagnostic. Fetches a URL from a GitHub-hosted runner (a datacenter
# IP) and classifies the response: reachable, or blocked by a Cloudflare
# challenge / 403. Use to decide whether a source must run from a residential
# IP (self-hosted runner — B-25) vs. can run in normal CI. Read-only; no commit.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to probe from the CI runner"
        required: true
        type: string
      show_body:
        # Reachability alone can't tell a live page from a stale cached
        # one. With this on, the probe also dumps the response headers,
        # any /portfolio/-style detail links it can see, and the head of
        # the body — enough to compare what CI is served against what a
        # browser shows (B-97).
        description: "Also print response headers + a body excerpt"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install requests && bash scratch_probe/run.sh
