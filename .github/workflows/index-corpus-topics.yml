# Editorial-corpus topic indexer (Mark feedback 2026-05-20).
#
# Runs `corpus_topic_indexer.py` against the 8 editorial-corpus JSON
# files and writes back theme tags via Claude Haiku 4.5. Idempotent —
# articles with a non-empty `themes` field are skipped, so weekly
# cron runs only spend tokens on newly-scraped articles.
#
# COST EXPECTATIONS
#   - First full corpus run: ~$9 (Haiku rates, 8,556 articles)
#   - Weekly incremental: pennies (typically 5-50 new articles)
#
# Schedule fires Sunday 17:00 UTC. It used to sit one hour after a Sunday
# 16:00 editorial scrape; that scrape is daily now, so this is simply the
# weekly sweep that tags whatever the week brought in.
#
# DELIBERATE CADENCE MISMATCH (updated 2026-09-09): the editorial-corpus scrape
# now runs DAILY (scrape-editorial-corpus.yml: '0 8 * * *'), while this topic
# indexer stays Sunday-only — so a freshly-scraped article can wait up to a
# week for its LLM `themes` tags, where it used to wait up to four days.
# Still accepted, for the same reason: `themes` aren't surfaced in the UI at
# all (recommender substrate only — see RECOMMENDER_STRATEGY.md), the articles
# appear in Editorial immediately regardless, and the indexer is idempotent so
# Sunday sweeps up every still-untagged article. Cost is unchanged either way
# (the same new articles, tagged once). If themes ever DO become user-visible,
# bump this cron to '0 9 * * *' — an hour after the daily scrape.
#
# Manual `workflow_dispatch` trigger exposes limit / source / retag inputs for
# ad-hoc runs (e.g. to tag Wednesday's batch early).
#
# Secrets required: ANTHROPIC_API_KEY (Anthropic Console → API Keys).
name: Index editorial corpus topics

on:
  schedule:
    - cron: '0 17 * * 0'   # Sunday only — sweeps up the week's untagged articles (see header)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max articles to tag (0 = no limit, full corpus)'
        required: false
        default: '0'
        type: string
      source:
        description: 'Restrict to one source filename prefix (e.g. hairspring_finds). Blank = all sources.'
        required: false
        default: ''
        type: string
      retag:
        description: 'Re-tag every article, even ones already tagged'
        required: false
        default: false
        type: boolean

concurrency:
  group: index-corpus-topics
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          # PAT or GITHUB_TOKEN sufficient for committing to main —
          # matches the pattern used by scrape-editorial-corpus.yml.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Anthropic SDK
        run: pip install -r requirements-ai.txt

      - name: Run topic indexer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Manual trigger: respect the inputs. Scheduled trigger: run
          # full incremental (default flags, idempotency skips tagged).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS=""
            LIMIT="${{ github.event.inputs.limit }}"
            SOURCE="${{ github.event.inputs.source }}"
            RETAG="${{ github.event.inputs.retag }}"
            [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ] && ARGS="$ARGS --limit $LIMIT"
            [ -n "$SOURCE" ] && ARGS="$ARGS --source $SOURCE"
            [ "$RETAG" = "true" ] && ARGS="$ARGS --retag"
            echo "Running with args: $ARGS"
            python corpus_topic_indexer.py $ARGS
          else
            echo "Scheduled incremental run (idempotent, only new articles)"
            python corpus_topic_indexer.py
          fi

      - name: Commit + push tagged corpus
        # Stage EVERY tagged source (the indexer rewrites all SOURCE_META_PATHS —
        # keep this in lockstep with that list). A long --retag run races main, so
        # the push retry rebases with --autostash. PREVIOUS BUG: only 8 of the 12
        # sources were staged, so the 4 newer ones (screwdowncrown, woe_dispatch,
        # christies_stories, fratello) were left UNSTAGED → the rebase aborted
        # ("you have unstaged changes") → a 3.5h / ~$12 retag was discarded.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Broad add. This list used to mirror corpus_topic_indexer.py's
          # SOURCES by hand, so adding a source there without editing here
          # meant its freshly-written topic tags were silently discarded
          # every run. --autostash below already stops an unstaged file
          # from aborting the rebase; this stops the drift itself.
          git add public/ data/
          if git diff --staged --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          git commit -m "Index editorial corpus topics $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Retry on race with the scrape cron. --autostash so any stray unstaged
          # change can't abort the rebase and bin the whole run.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push failed; rebasing and retrying ($i/3)…"
            git pull --rebase --autostash origin main
            sleep 5
          done
          echo "Push failed after 3 attempts."
          exit 1
