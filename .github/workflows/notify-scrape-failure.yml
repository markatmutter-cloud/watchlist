name: Notify on scrape failure

# Listens for any scrape workflow's completion. If it failed, opens a
# GitHub Issue (or comments on the existing open one) so Mark gets the
# usual GitHub notification path (mobile push / email / web) without
# having to babysit Actions. Auto-closes the issue on a subsequent
# successful run of the same workflow.
#
# Why this and not GitHub's built-in "Notify me when workflows fail"?
# That setting is on by default but the notification is buried alongside
# every other Actions event; this surfaces failures as actionable
# Issues that stay open until acknowledged.
#
# Implementation note (B-23): this uses the pre-installed `gh` CLI in a
# plain run step, NOT actions/github-script. github-script must be
# downloaded from GitHub's CDN at job setup, and a transient CDN blip
# serving that tarball once crashed THIS workflow at setup — which
# GitHub then emailed Mark as "Notify on scrape failure: All jobs have
# failed", a false alarm that read like every scraper had died. `gh` is
# already on the runner, so this job needs no action download and can't
# fail that way again.

on:
  workflow_run:
    # THE RULE: every workflow with a `cron:` gets listed here. A
    # scheduled job nobody is watching fails silently by construction —
    # there's no human at the keyboard when it runs.
    #
    # This list was missing both editorial workflows, and it cost a
    # month: "Scrape editorial corpus" failed on all 10 runs from
    # 2026-07-15 to 08-16 (push race, fixed in #920) and never opened an
    # issue, so the corpus sat frozen at the 07-12 refresh while the
    # dealer-side alerts kept arriving daily and looked like the only
    # problem. Adding a cron without adding it here re-opens that hole.
    workflows:
      - "Scrape listings"
      - "Scrape auctions"
      - "Scrape auction lots (frequent)"
      - "Scrape eBay"
      - "Rollup listing events"
      - "Scrape editorial corpus"
      - "Index editorial corpus topics"
      - "Health report"
      - "Calendar canary"
      # Not a cron — but a red `main` is the failure Mark actually sees
      # most often, and GitHub's built-in email for it says only "Tests:
      # All jobs have failed". A date-rotted fixture in
      # HomeAuctionModule.test.jsx failed every push for two days that
      # way (2026-09-02 to 09-04): ~24 identical emails, none of which
      # said which test or why. The job-level `if` below keeps this to
      # main, so a red PR does not open an issue.
      - "Tests"
    types:
      - completed

permissions:
  issues: write
  contents: read
  actions: read   # gh run view --log-failed, for the "why" below

jobs:
  notify:
    # Default branch only. A failing PR is already in front of the person
    # who opened it; an issue per red PR would bury the scheduled-run
    # alerts this workflow exists for.
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      # Handed to the triage job below. Empty on a recovery/no-op run,
      # which is how triage knows to skip.
      issue: ${{ steps.alert.outputs.issue }}
    steps:
      - name: Open / update / close the failure issue via gh CLI
        id: alert
        # All workflow_run fields are passed through env (never inlined
        # into the script) to avoid shell-injection from run metadata.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT: ${{ github.event.workflow_run.event }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          sha="${HEAD_SHA:0:7}"
          prefix="[scrape-fail] ${WF_NAME}"

          # Find an open issue we previously opened for this workflow.
          existing=$(gh issue list --repo "$GH_REPO" --label scrape-failure \
            --state open --limit 50 --json number,title \
            --jq "[.[] | select(.title | startswith(\"$prefix\"))][0].number // empty")

          if [ "$CONCLUSION" = "failure" ]; then
            # ── WHY did it fail? ────────────────────────────────────────
            # The alert used to carry only a workflow name and a link, so
            # answering "do I need to do anything?" meant opening the run
            # and scrolling a few thousand lines. scrape_failure_reason.py
            # reads the failed steps' log and names the likely cause.
            #
            # Every command here is allowed to fail without taking the
            # alert with it: an alert missing its diagnosis is degraded,
            # an alert that never opens is the silent failure this whole
            # workflow exists to prevent. Note this adds no action
            # download (see the B-23 note above) — `gh` is on the runner
            # already and the script comes through the same API call the
            # rest of the step depends on anyway.
            why="_No diagnosis available for this run — open the run link below._"
            if gh run view "$RUN_ID" --repo "$GH_REPO" --log-failed > failed.log 2>/dev/null \
               && [ -s failed.log ] \
               && gh api "repos/$GH_REPO/contents/scrape_failure_reason.py" \
                    -H "Accept: application/vnd.github.raw" > reason.py 2>/dev/null \
               && [ -s reason.py ]; then
              why=$(python3 reason.py failed.log 2>/dev/null || printf '%s' "$why")
            fi

            body=$(printf '%s\n\n%s\n\n%s\n\n%s\n%s\n\n%s' \
              "Workflow **${WF_NAME}** failed on \`${sha}\` at ${UPDATED_AT}." \
              "${why}" \
              "Run: ${RUN_URL}" \
              "Triggered: ${EVENT}" \
              "Run ID: ${RUN_ID}" \
              "_Auto-opened by notify-scrape-failure. This issue auto-closes when ${WF_NAME} runs successfully again._")
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GH_REPO" --body "$body"
              echo "Commented on existing issue #$existing"
              echo "issue=$existing" >> "$GITHUB_OUTPUT"
            else
              url=$(gh issue create --repo "$GH_REPO" --title "$prefix — $sha" \
                --body "$body" --label scrape-failure)
              echo "Opened new issue for $WF_NAME: $url"
              echo "issue=${url##*/}" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$CONCLUSION" = "success" ] && [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GH_REPO" \
              --body "Recovered: ${WF_NAME} succeeded on \`${sha}\` at ${UPDATED_AT}. Run: ${RUN_URL}"
            gh issue close "$existing" --repo "$GH_REPO" --reason completed
            echo "Closed recovered issue #$existing"
          else
            echo "No action for conclusion=${CONCLUSION} (no existing open issue)"
          fi

  # ── Triage ────────────────────────────────────────────────────────────
  # Probes the implicated dealers and answers "is this ours?" on the issue
  # the job above just opened.
  #
  # WHY THIS LIVES HERE AND NOT IN ITS OWN WORKFLOW. It was its own
  # workflow, triggered by `issues: [opened]`, and it NEVER RAN ONCE in
  # the week after it shipped — zero runs, while seven alerts went out
  # unanswered. GitHub deliberately does not start a workflow from an
  # event created with GITHUB_TOKEN, and the job above opens that issue
  # with exactly that token. The trigger could never have fired, and no
  # amount of unit testing would have shown it: the bug was in the
  # wiring, and the only test that catches it is a real firing.
  #
  # A `needs:` edge is not an event, so the restriction does not apply.
  # It also cannot race the alert or comment into the void.
  #
  # Separate JOB rather than a step so the alert path keeps its B-23
  # property of downloading no actions: this job checks out the repo (it
  # reads the move step and the scrapers' URL constants), and if that
  # download blips, the alert has already been posted by the job above.
  triage:
    needs: notify
    if: needs.notify.outputs.issue != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe the implicated sources and comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ needs.notify.outputs.issue }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -uo pipefail

          if ! gh run view "$RUN_ID" --repo "$GH_REPO" --log-failed > failed.log 2>/dev/null \
             || [ ! -s failed.log ]; then
            # Logs expire, and a job that died at setup has none. The
            # issue body carries the gate's source list either way.
            gh issue view "$ISSUE" --repo "$GH_REPO" --json body --jq .body > failed.log 2>/dev/null || true
            echo "Run logs unavailable — falling back to the issue body."
          fi
          [ -s failed.log ] || { echo "Nothing to triage."; exit 0; }

          python3 triage_scrape_failure.py failed.log > triage.md || {
            echo "Triage itself failed; not commenting." >&2
            exit 0
          }

          if [ -s triage.md ]; then
            gh issue comment "$ISSUE" --repo "$GH_REPO" --body-file triage.md
            echo "Triaged #$ISSUE"
          fi
          cat triage.md >> "$GITHUB_STEP_SUMMARY"
