name: Scrape editorial corpus

# Daily cron for editorial-corpus scrapers (Mark, 2026-09-09). These
# sources publish 1-2 articles/week each, so most runs will find nothing
# new — that is the accepted cost. With the new interface the site wants
# fresh reading material every morning, and a twice-weekly cadence meant
# a piece published on Thursday sat undiscovered until Sunday.
#
# Each run is ~25 min and the scrapers are incremental (they stop at the
# most-recently-scraped URL), so daily is cheap: it re-walks the same
# sitemaps, it does not re-fetch known articles.
#
# WHY 08:00 UTC and not a time that reads like "morning".
# Mark wants this landed before he wakes (Pacific). 08:00 UTC is 1am PDT
# / midnight PST, which looks absurdly early until you account for the
# scheduler: GitHub has been starting this repo's crons 2-3 HOURS late
# all week (this workflow, scheduled 16:00, has started at 17:51, 18:54
# and 19:03 on recent runs; the listings cron once slipped 3h18m). So the
# cron time is a floor, not a promise. 08:00 + a 3h slip + 25 min still
# finishes around 4am PDT; even a 5h slip lands before 7am. Aiming at
# 6am would have missed most mornings.
#
# The main listings cron runs at 14/20/02 UTC, so this slot avoids overlap.
#
# NB the LLM topic-tagger (index-corpus-topics.yml) stays SUNDAY-ONLY, so a
# freshly-scraped article now waits up to a week for its `themes` tags. Still
# deliberate: themes are recommender substrate and are not surfaced in the UI,
# and articles appear in Editorial immediately regardless — see that file's
# header before changing it.
#
# Scope (2026-05-19):
# - bring_a_loupe_scraper.py    → public/bring_a_loupe.json
#   (Hodinkee column, ~251 articles, sitemap-based URL discovery)
# - rolex_magazine_scraper.py   → public/rolex_magazine.json
#   (Jake's Rolex World, ~3,840 posts, Blogger JSON feeds API,
#   incremental on every cron — stops at most-recently-scraped URL)
# - onthedash_scraper.py        → public/onthedash.json
#   (Jeff Stein / On The Dash, ~206 article posts, WordPress REST
#   API, incremental — stops at most-recently-scraped URL.
#   Catalogue-shaped /chronograph/ pages explicitly excluded.)
# - bulangandsons_watch_talks_scraper.py → public/bulang_watch_talks.json
#   (Bulang & Sons editorial blog, ~166 articles, Shopify blog
#   pagination. Editorial-only: feeds the corpus, NOT the Sold-
#   archive view — the Bulang dealer inventory has its own scraper
#   in the listings cron.)
# - hodinkee_shop_scraper.py    → public/hodinkee_shop.json
#   (Hodinkee Shop vintage archive, ~2,346 sold products, Shopify
#   products.json API. Frozen since Feb 2023. Dual-track: feeds
#   editorial corpus AND projects into App.js's Sold-archive view
#   via `hodinkeeShopItems` — same pattern as Hairspring Finds.)
# - hodinkee_reference_points_scraper.py → public/hodinkee_reference_points.json
#   (Hodinkee's flagship per-reference series — ~10 deep-dive
#   articles totaling ~50K words. Sitemap-based discovery, same
#   Hodinkee parser as Bring a Loupe.)
# - acollectedman_journal_scraper.py → public/acollectedman_journal.json
#   (A Collected Man / London independent + vintage dealer Journal,
#   ~321 articles. Sitemap-based discovery because Shopify pagination
#   caps at ~28 on this site. Collector's guides + design-technical
#   essays + maker interviews.)
#
# Hairspring Finds intentionally NOT included here — it runs in the
# main listings workflow (scrape-listings.yml) because its records
# also project into the Sold archive view, so daily refresh matches
# the rest of the dealer/lot pipeline. Editorial-only sources (no
# transactional surface) belong here.
#
# Future additions queued: WatchFID Journal (WordPress), Wind
# Vintage journal, Hairspring non-Finds blog. Each as its own
# scraper file emitting one JSON; add a step below per source.

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC daily — lands before a Pacific morning even with GitHub's 2-3h cron slip
  workflow_dispatch:

concurrency:
  group: scrape-editorial-corpus
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Hodinkee Bring a Loupe scraper
        # Sitemap-based URL discovery, ~251 articles. Incremental
        # by default: re-fetches only entries missing or >30 days
        # since last scrape. First full run takes ~3-4 min;
        # subsequent runs are sub-minute (typically 0-2 new
        # articles + the rolling refresh window).
        continue-on-error: true
        run: python bring_a_loupe_scraper.py

      - name: Run Rolex Magazine scraper
        # Blogger JSON feeds API, ~3,840 posts in corpus. Incremental
        # on every cron — walks the feed head until it hits the
        # most-recently-scraped URL. Typical weekly run fetches
        # 5-15 new posts in <1 second. ROLEX_MAGAZINE_FULL_REFRESH=1
        # forces a full re-walk (~30 sec) if records need to be
        # rebuilt.
        continue-on-error: true
        run: python rolex_magazine_scraper.py

      - name: Run On The Dash scraper
        # WordPress REST API, ~206 article posts (catalogue-shaped
        # /chronograph/ pages excluded — those don't fit body_text +
        # word_count). New posts ship ~1×/month so this is wasteful
        # on a weekly cron in absolute terms, but cheap on incremental
        # mode (stops at the first known URL — typically a single
        # request when nothing new has shipped). ONTHEDASH_FULL_REFRESH=1
        # forces a full walk.
        continue-on-error: true
        run: python onthedash_scraper.py

      - name: Run Bulang & Sons Watch Talks scraper
        # Shopify blog, ~166 articles (the dealer's editorial blog,
        # not the inventory). Incremental — re-fetches missing
        # entries + the rolling 30-day refresh window. Full walk
        # takes ~2 min; typical weekly run is sub-minute (no new
        # posts most weeks).
        continue-on-error: true
        run: python bulangandsons_watch_talks_scraper.py

      - name: Run Romain Réa editorial scraper
        # Two small Shopify blogs (Expert Files + Dating, ~31 posts)
        # folded into one corpus file. Stub posts (video embeds,
        # dead-PDF wrappers) drop at the <100-word threshold —
        # ~16 real essays survive. Incremental, same 30-day refresh
        # window as the other blog scrapers.
        continue-on-error: true
        run: python romainrea_editorial_scraper.py

      - name: Run Hodinkee Shop archive scraper
        # Shopify products.json API, ~2,346 products. Collection
        # frozen since Feb 2023 (Hodinkee shut the vintage shop),
        # so weekly runs are no-ops except for the rare data
        # correction. Full walk ~15s; incremental skips records
        # already on disk. Dual-track: feeds editorial corpus AND
        # the Sold-archive projection in App.js.
        continue-on-error: true
        run: python hodinkee_shop_scraper.py

      - name: Run Hodinkee Reference Points scraper
        # Sitemap-based discovery, ~10 articles. Encyclopedia-grade
        # per-reference deep dives (Pulvirent Submariner 10k words,
        # Clymer Carrera 8k, Bues GMT-Master 9k, etc.). New entries
        # land ~1×/year so weekly is wasteful in absolute terms but
        # cheap on incremental.
        continue-on-error: true
        run: python hodinkee_reference_points_scraper.py

      - name: Run A Collected Man Journal scraper
        # Sitemap-based discovery (Shopify blog pagination caps at
        # ~28 articles even though the full corpus is ~321; switched
        # to sitemap_blogs_1.xml — same approach as bring_a_loupe).
        # London-based independent / unusual / vintage dealer; the
        # Journal carries collector's guides, design-technical essays,
        # and interviews with makers + collectors. Incremental with
        # 30-day rolling refresh; full walk ~3 min.
        continue-on-error: true
        run: python acollectedman_journal_scraper.py

      - name: Run WOE Dispatch scraper
        # Watches of Espionage — horology / special operations /
        # intelligence / exploration crossover blog. Shopify blog,
        # ~239 articles via standard ?page=N pagination. Body wrapper
        # anchored on schema.org itemprop="articleBody". Author is
        # typically the "Watches of Espionage" byline (no per-article
        # bylines). Incremental with 30-day rolling refresh; full walk
        # ~3 min, typical weekly run sub-minute.
        continue-on-error: true
        run: python woe_dispatch_scraper.py

      - name: Run Screw Down Crown scraper
        # Substack publication by kingflum. Free posts only via the
        # public /api/v1/archive endpoint + audience='everyone' filter.
        # Paid posts are deliberately skipped — the public corpus
        # respects the paywall and the manifest carries the publisher's
        # subscribe_url for an optional "Subscribe to <publication>"
        # CTA when the source is filtered on. Incremental with 30-day
        # rolling refresh.
        continue-on-error: true
        run: python screwdowncrown_scraper.py

      - name: Run Fratello Watches scraper
        # High-volume watch publication. WordPress REST API at
        # /wp-json/wp/v2/posts paginated 100 per page over ~117 pages
        # of total archive. Brand-allowlist + "vintage" / TBT include
        # filter, hard excludes Hublot/AP/microbrand/sub-$500/gift-
        # guide; soft-excludes Seiko unless the article carries a
        # vintage signal (so multi-brand vintage roundups land
        # correctly). FRATELLO_FULL_REFRESH=1 forces a full walk;
        # default cron run is incremental (newest first + skip-fresh).
        continue-on-error: true
        run: python fratello_scraper.py

      - name: Run Le Monde Edmond scraper
        # Collector-essay site (Edmond / "Mr. A"). WordPress REST API,
        # scoped to the watch-side category term IDs (fine-watches tree
        # + collecting-investing — Mark spec 2026-06-06); classic-cars
        # excluded. Low-volume (~280 posts to 2012), 30-day rolling
        # refresh; LME_FULL_REFRESH=1 forces a full walk.
        continue-on-error: true
        run: python le_monde_edmond_scraper.py

      - name: Run Strictly Vintage Watches scraper
        # Charlie Dunne's collector-scholarship site (Squarespace).
        # Sitemap-based discovery (category pages expose no item API);
        # shop (/vintagewatches/) + nav excluded, <200-word pages
        # dropped (~55 of ~110 sitemap URLs survive). 30-day rolling
        # refresh; SVW_FULL_REFRESH=1 forces a full walk.
        continue-on-error: true
        run: python strictlyvintagewatches_scraper.py

      - name: Run Christie's Stories scraper
        # Curated URL list at data/christies_stories_urls.json —
        # Christie's stories index is client-rendered SPA (302 redirect
        # on direct fetch) and the main sitemap.xml is a lot-finder
        # redirector, so URLs are added manually by Mark. Substantive
        # long-form editorial (collecting guides, deconstructed series,
        # celebrity-watch features) typically 600-2,200 words per
        # article. Two known SPA-hydrated articles fail body extraction;
        # the remaining ~92% land with og:title + datePublished +
        # og:image + body paragraphs. CHRISTIES_STORIES_FULL_REFRESH=1
        # forces re-fetch; default is 30-day rolling.
        continue-on-error: true
        run: python christies_stories_scraper.py

      - name: Run Hodinkee Picks scraper
        # Curated one-off Hodinkee articles (vintage-relevant features
        # outside the BAL / Reference Points columns). URLs added by
        # Mark in data/hodinkee_picks_urls.json; same pattern as
        # christies_stories above. See hodinkee_picks_scraper.py.
        continue-on-error: true
        run: python hodinkee_picks_scraper.py

      - name: Run Watchfid editorial scraper
        # The blog half of watchfid.com. The dealer scraper
        # (watchfid_scraper.py, in the listings cron) reads the custom
        # /watch/<slug>/ inventory post type; this reads /wp-json/wp/v2/posts,
        # which is editorial-only precisely because inventory is a separate
        # post type. WordPress + Elementor — see the scraper's docstring for
        # the Elementor thin-body failure mode. Incremental with a 30-day
        # rolling refresh; WATCHFID_FULL_REFRESH=1 forces a full walk.
        continue-on-error: true
        run: python watchfid_editorial_scraper.py

      - name: Record source freshness
        # Additive: only updates the sources whose artifacts exist in this
        # checkout, so each workflow contributes its own slice of the
        # ledger. Runs BEFORE the commit so `git add data/` persists it.
        # Always exits 0 — the freshness GATE runs in health-report.yml,
        # not here, so a stale source can't red a scrape that worked.
        if: always()
        continue-on-error: true
        run: python3 source_freshness.py --record

      - name: Commit and push
        # Stage the whole output tree, not a hand-listed set of files.
        # The list drifted: hodinkee_picks_scraper.py was added above but
        # its two JSONs never joined the list, so every run left them
        # modified-but-unstaged. `git pull --rebase` refuses to run with
        # unstaged changes, so the moment a parallel workflow pushed to
        # main first, all three retries died on "cannot pull with rebase"
        # and the whole scrape was thrown away. That killed every run from
        # 2026-07-15 to 2026-08-16 (corpus frozen at the 07-12 refresh).
        # Same broad-add + rebase-retry as scrape-listings.yml; adding a
        # source no longer means remembering to edit this step.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/ data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Editorial corpus refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected, rebasing and retrying ($i/3)..."
            if ! git pull --rebase --autostash --strategy-option=theirs; then
              echo "Rebase failed, aborting and retrying push"
              git rebase --abort 2>/dev/null || true
            fi
          done
          echo "Push still failing after 3 retries"
          exit 1
